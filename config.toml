# Grupa = jeden folder wyjściowy (np. jedna kampania klipowania, jedna gra albo jeden streamer).
# Kanały:  "twitch:nazwa"  "youtube:nazwa"  "kick:nazwa"  albo dowolny link, który obsługuje yt-dlp.
# Klipuj tylko streamerów, którzy płacą za klipy (kampanie) albo dali Ci zgodę.

[[group]]
name = "gta6"
channels = ["twitch:KANAL1", "youtube:KANAL2"]
keywords = ["gta"]                     # filtr po tytule VOD-a, [] = wszystko
hashtags = "#gta6 #gta #gaming #shorts"

[[group]]
name = "tarkov"
channels = ["twitch:KANAL3"]
keywords = ["tarkov", "eft"]
hashtags = "#tarkov #eft #escapefromtarkov #gaming"
# facecam = [0.0, 0.7, 0.25, 0.3]      # kamerka streamera u góry klipu: [x, y, szer, wys] jako ułamki kadru
                                       # odczytasz je z: python clipper.py --frame <link VOD>

[settings]
out_dir = "out"
work_dir = "work"
vods_per_channel = 3        # ile najnowszych VOD-ów sprawdzać na kanał
clips_per_vod = 5

# wykrywanie momentów
window = 10                 # długość "wybuchu" w sekundach
chat_min_ratio = 3.0        # czat: min. ile razy aktywniej niż zwykle
audio_min_ratio = 2.5       # dźwięk: min. ile razy głośniej niż zwykle (gdy nie ma czatu)
min_gap = 120               # min. odstęp między klipami (s)
before = 25                 # sekundy przed wybuchem (reakcja przychodzi po akcji)
after = 10                  # sekundy po

# napisy (faster-whisper)
whisper_model = "large-v3-turbo"   # RTX 3070 8 GB: OK. Mniej VRAM: "medium" / "small"
device = "cuda"                    # "cpu" bez karty NVIDIA (wolniej)
language = ""                      # "" = auto, albo "en", "pl", "ru"...
words_per_line = 3
font_size = 80
margin_v = 520                     # napisy: odległość od dołu (px na 1920)

# wideo
encoder = "h264_nvenc"      # NVIDIA. Sam przełączy się na "libx264" (CPU), jeśli NVENC nie działa
quality = 23                # niżej = lepiej i większy plik
zoom = 1.3                  # przybliżenie gameplayu, gdy nie ma facecam (1.0 = cały kadr)
